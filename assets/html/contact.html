<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto</title>
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/contact.css" />
  </head>
  <body>
    <header>
      <!-- Navbar -->
      <nav class="navbar navbar-expand-lg banner-nav">
        <div class="container-fluid">
          <!-- Logo and brand -->
          <a
            href="../../index.html"
            class="logo-brand d-flex align-items-center navbar-brand"
          >
            <img src="../img/logo.png" alt="Ayllu logo" />
            <span class="brand-name">Ayllu</span>
          </a>
          <!-- Responsive button -->
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbar-nav"
            aria-controls="navbar-nav"
            aria-expanded="false"
            aria-label="Menú de navegación"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <!-- Links -->
          <div
            class="collapse navbar-collapse justify-content-end"
            id="navbar-nav"
          >
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="../../index.html">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./about-us.html">¿Quiénes somos?</a>
              </li>
              <li class="nav-item">
                <a
                  class="nav-link active"
                  aria-current="page"
                  href="./contact.html"
                  >Contacto</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>
      <!-- Title -->
      <div class="banner-title">
        <h1 id="contact-title">
          ¡Contáctanos para recibir actualizaciones de nuestras actividades!
        </h1>
      </div>
    </header>
    <main class="contact-wrapper" aria-labelledby="contact-title">
      <!-- Left image -->
      <aside class="side-image">
        <img
          src="../img/contact1.jpg"
          alt="People sharing peruvian culture"
          class="img-fluid"
        />
      </aside>
      <!-- Form -->
      <section id="contact-section" class="form-section">
        <div class="form-container">
          <h2>Contact Us</h2>
          <form id="contact-form" autocomplete="off" novalidate>
            <div class="form-row">
              <div class="form-field">
                <label for="name">Nombre Completo</label>
                <input
                  type="text"
                  id="name"
                  name="name"
                  placeholder="Nombre y Apellido"
                  required
                  aria-required="true"
                />
              </div>
              <div class="form-field">
                <label for="email">Email</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Colócalo aquí"
                  required
                  aria-required="true"
                />
              </div>
            </div>
            <div class="form-field">
              <label for="message">Mensaje</label>
              <textarea
                id="message"
                name="message"
                rows="4"
                placeholder="What would you like to know?"
                required
                aria-required="true"
              ></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Enviar</button>
          </form>
          <p
            id="thank-you-message"
            class="thank-you-message"
            aria-live="polite"
            hidden
          >
            ¡Gracias por contactarnos! 💌
          </p>
        </div>
      </section>
      <!-- Right image -->
      <aside class="side-image">
        <img
          src="../img/contact2.jpg"
          alt="Arte textil de la cultura peruana"
          class="img-fluid"
        />
      </aside>
    </main>
    <script>
      const form = document.getElementById("contact-form");
      const thankYouMessage = document.getElementById("thank-you-message");

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        thankYouMessage.hidden = false;
        form.reset();
        form.querySelector("button[type='submit']").blur();
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
