<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/formulario.css" />
  </head>
  <body>
    <nav
      class="banner-nav navbar navbar-expand-lg"
      aria-label="Navegación principal"
    >
      <div class="container-fluid">
        <a class="logo-brand d-flex align-items-center" href="index.html">
          <img src="../img/logo.png" alt="Logo Ayllu" />
          <span class="brand">Ayllu</span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#main-navbar"
          aria-controls="main-navbar"
          aria-expanded="false"
          aria-label="Mostrar navegación"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="collapse navbar-collapse justify-content-end"
          id="main-navbar"
        >
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="../../index.html"
                >Hogar</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../html/about-us.html"
                >¿Quiénes somos?</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../html/form.html">Contáctanos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="../html/activities.html"
                >¡Inscríbete!</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="form-container">
      <h2 class="titulo">¡CONTÁCTANOS!💬</h2>
      <form id="myForm">
        <label for="Usuario">Nombre:</label>
        <input type="text" id="Usuario" name="Usuario" required />
        <br />
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />
        <br />
        <label for="contraseña">Asunto:</label>
        <input type="texto" id="asunto" name="asunto" required />
        <br />
        <label for="comentario">¿Tienes dudas?</label>
        <textarea
          name="sugerencias"
          placeholder="Déjanos saberlo aquí!"
          id="sugerencias"
        ></textarea>
        <br />
        <button type="submit">Enviar</button>
      </form>
    </div>

    <script src="../js/form.js"></script>
  </body>
</html>
