<body>
     <nav
        class="banner-nav navbar navbar-expand-lg"
        aria-label="Main navigation"
      >
        <div class="container-fluid">
          <a class="logo-brand d-flex align-items-center" href="index.html">
            <img src="../img/logo.png" alt="Ayllu logo" /> <!-- Corrige la ruta -->
            <span class="brand">Ayllu</span>
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#main-navbar"
            aria-controls="main-navbar"
            aria-expanded="false"
            aria-label="Mostrar navegación"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div
            class="collapse navbar-collapse justify-content-end"
            id="main-navbar"
          >
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="../../index.html">Inicio</a>
              </li>
              <li class="nav-item">

              </li>
            </ul>
          </div>
        </div>
      </nav>
      
    <div class="form-container">
        
        <h2 class="titulo">¡CONTÁCTANOS!💬</h2>
        <form id="myForm">
        <label for="Usuario">Nombre:</label>
        <input type="text" id="Usuario" name="Usuario" required>
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br>
        <label for="contraseña">Asunto:</label>
        <input type="texto" id="asunto" name="asunto" required>
        <br>
        <label for="comentario">¿Tienes dudas?</label>
        <textarea name="sugerencias" placeholder="Déjanos saberlo aquí!" id="sugerencias"></textarea>
        <br>
        <button type="submit">Enviar</button>
    </form>
    </div>
    
<script src="../js/form.js"></script>
