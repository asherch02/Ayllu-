<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<link rel="stylesheet" href="../css/formulario.css">
<body>
    <form id="myForm">
        <label for="Usuario">Nombre:</label>
        <input type="text" id="Usuario" name="Usuario" required>
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br>
        <label for="contraseña">Asunto:</label>
        <input type="texto" id="asunto" name="asunto" required>
        <br>
        <label for="comentario">Sugerencias</label>
        <textarea name="sugerencias" placeholder="Ingresa tu sugerencia!" id="sugerencias"></textarea>
        <br>
        <button type="submit">Enviar</button>
    </form>
<script src="../js/form.js"></script>
</body>
</html>
